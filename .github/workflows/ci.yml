name: NISAKSHI CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - codex/phase-2-self-hosted-inference

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Compile backend
        run: python -m compileall -q .
        working-directory: backend
      - name: Test service-token validation
        run: pytest -q
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nisakshi_ci?schema=public
      AUTH_SECRET: ci-only-secret-value-with-at-least-32-bytes
      AUTH_GOOGLE_ID: ci-placeholder-client-id
      AUTH_GOOGLE_SECRET: ci-placeholder-client-secret
      AUTH_TRUST_HOST: "true"
      BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format Terraform
        run: terraform fmt -check -recursive cloud/terraform
      - name: Initialize Terraform without remote state
        run: terraform init -backend=false
        working-directory: cloud/terraform
      - name: Validate Terraform
        run: terraform validate
        working-directory: cloud/terraform

  backend-container:
    name: Backend container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag nisakshi-backend-ci ./backend
